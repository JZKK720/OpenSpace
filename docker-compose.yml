services:
  openspace-remote-agent:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        PYTHON_BASE_IMAGE: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-base-python:${OPENSPACE_IMAGE_TAG:-main}"
    image: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-runtime:${OPENSPACE_IMAGE_TAG:-main}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      OPENSPACE_WORKSPACE: "/app"
      OPENSPACE_BACKEND_SCOPE: "${OPENSPACE_REMOTE_BACKEND_SCOPE:-shell,system}"
      OPENSPACE_MODEL: "${OPENSPACE_MODEL:-}"
      OPENSPACE_ENABLE_RECORDING: "${OPENSPACE_ENABLE_RECORDING:-true}"
      OPENSPACE_LLM_API_KEY: "${OPENSPACE_LLM_API_KEY:-}"
      OPENSPACE_LLM_API_BASE: "${OPENSPACE_LLM_API_BASE:-}"
      OPENSPACE_LLM_EXTRA_HEADERS: "${OPENSPACE_LLM_EXTRA_HEADERS:-}"
      OPENSPACE_LLM_CONFIG: "${OPENSPACE_LLM_CONFIG:-}"
      OPENSPACE_API_KEY: "${OPENSPACE_API_KEY:-}"
      OPENSPACE_API_BASE: "${OPENSPACE_API_BASE:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      FASTMCP_TRANSPORT_SECURITY__ENABLE_DNS_REBINDING_PROTECTION: "false"
    # No host port binding — accessible only via internal Docker network (openspace-remote-agent:8080).
    # Port 8789 is reserved for hermes-gateway (OpenAI-compat API that OpenSpace calls).
    volumes:
      - openspace_data:/app/.openspace
      - ./logs:/app/logs
      - ./openspace/config/external_agents.json:/app/openspace/config/external_agents.json:ro
    command: ["python", "-m", "openspace.mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; conn = socket.create_connection(('127.0.0.1', 8080), 5); conn.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  openspace-runtime:
    build:
      context: .
      dockerfile: Dockerfile.runtime
      args:
        PYTHON_BASE_IMAGE: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-base-python:${OPENSPACE_IMAGE_TAG:-main}"
    image: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-runtime:${OPENSPACE_IMAGE_TAG:-main}"
    depends_on:
      openspace-remote-agent:
        condition: service_healthy
      openhuman:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      OPENSPACE_WORKSPACE: "/app"
      OPENSPACE_BACKEND_SCOPE: "${OPENSPACE_RUNTIME_BACKEND_SCOPE:-shell,mcp,system}"
      OPENSPACE_MODEL: "${OPENSPACE_MODEL:-}"
      OPENSPACE_ENABLE_RECORDING: "${OPENSPACE_ENABLE_RECORDING:-true}"
      OPENSPACE_LLM_API_KEY: "${OPENSPACE_LLM_API_KEY:-}"
      OPENSPACE_LLM_API_BASE: "${OPENSPACE_LLM_API_BASE:-}"
      OPENSPACE_LLM_EXTRA_HEADERS: "${OPENSPACE_LLM_EXTRA_HEADERS:-}"
      OPENSPACE_LLM_CONFIG: "${OPENSPACE_LLM_CONFIG:-}"
      OPENSPACE_API_KEY: "${OPENSPACE_API_KEY:-}"
      OPENSPACE_API_BASE: "${OPENSPACE_API_BASE:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      IRONCLAW_INTERNAL_URL: "${IRONCLAW_INTERNAL_URL:-http://host.docker.internal:3231/}"
      IRONCLAW_PUBLIC_URL: "${IRONCLAW_PUBLIC_URL:-http://127.0.0.1:3231/}"
      IRONCLAW_HEALTH_URL: "${IRONCLAW_HEALTH_URL:-http://host.docker.internal:3231/}"
      IRONCLAW_ACTION_URL: "${IRONCLAW_ACTION_URL:-http://host.docker.internal:3231/api/chat/send}"
      IRONCLAW_AUTH_TOKEN: "${IRONCLAW_AUTH_TOKEN:-}"
      GATEWAY_AUTH_TOKEN: "${GATEWAY_AUTH_TOKEN:-}"
      IRONCLAW_MCP_URL: "${IRONCLAW_MCP_URL:-}"
      OPENHUMAN_PUBLIC_URL: "${OPENHUMAN_PUBLIC_URL:-http://127.0.0.1:1420/}"
      OPENHUMAN_INTERNAL_URL: "${OPENHUMAN_INTERNAL_URL:-http://openhuman:7788/}"
      OPENHUMAN_HEALTH_URL: "${OPENHUMAN_HEALTH_URL:-http://openhuman:7788/health}"
      OPENHUMAN_ACTION_URL: "${OPENHUMAN_ACTION_URL:-http://openhuman:7788/rpc}"
      OPENHUMAN_RPC_TOKEN: "${OPENHUMAN_RPC_TOKEN:-}"
      HERMES_PUBLIC_URL: "${HERMES_PUBLIC_URL:-http://127.0.0.1:9119/}"
      HERMES_INTERNAL_URL: "${HERMES_INTERNAL_URL:-http://host.docker.internal:8789/}"
      HERMES_HEALTH_URL: "${HERMES_HEALTH_URL:-http://host.docker.internal:8789/health}"
      HERMES_ACTION_URL: "${HERMES_ACTION_URL:-http://host.docker.internal:8789/v1/chat/completions}"
      HERMES_API_KEY: "${HERMES_API_KEY:-}"
      OPENSPACE_REMOTE_INTERNAL_URL: "http://openspace-remote-agent:8080/mcp"
      OPENSPACE_REMOTE_HEALTH_URL: "http://openspace-remote-agent:8080/mcp"
      OPENSPACE_REMOTE_MCP_URL: "http://openspace-remote-agent:8080/mcp"
    ports:
      - "127.0.0.1:${OPENSPACE_RUNTIME_PORT:-8788}:8080"
    volumes:
      - openspace_data:/app/.openspace
      - ./logs:/app/logs
      - ./openspace/config/external_agents.json:/app/openspace/config/external_agents.json:ro
    command: ["python", "-m", "openspace.mcp_server", "--transport", "streamable-http", "--host", "0.0.0.0", "--port", "8080"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; conn = socket.create_connection(('127.0.0.1', 8080), 5); conn.close()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  openhuman:
    image: "${OPENHUMAN_CORE_IMAGE_REPOSITORY:-ghcr.io/jzkk720/openhuman-core}:${OPENHUMAN_CORE_IMAGE_TAG:-latest}"
    user: "${OPENHUMAN_CONTAINER_USER:-10001:10001}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BACKEND_URL: "https://api.tinyhumans.ai"
      OPENHUMAN_APP_ENV: production
      OPENHUMAN_CORE_HOST: "0.0.0.0"
      OPENHUMAN_CORE_PORT: "7788"
      OPENHUMAN_CORE_TOKEN: "${OPENHUMAN_RPC_TOKEN:-change-me-openhuman-rpc}"
      OPENHUMAN_OLLAMA_BASE_URL: "${OPENHUMAN_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
      OPENHUMAN_WORKSPACE: "/home/openhuman/.openhuman"
      XDG_CACHE_HOME: "/home/openhuman/.openhuman/cache"
      TMPDIR: "/tmp"
      RUST_LOG: "${OPENHUMAN_RUST_LOG:-info}"
    ports:
      - "127.0.0.1:${OPENHUMAN_DEBUG_PORT:-7181}:7788"
    volumes:
      - openhuman_workspace:/home/openhuman/.openhuman
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7788/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  agents-monitor:
    build:
      context: .
      dockerfile: Dockerfile.agents-monitor
      args:
        NODE_BASE_IMAGE: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-base-node:${OPENSPACE_IMAGE_TAG:-main}"
    image: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-agents-monitor:${OPENSPACE_IMAGE_TAG:-main}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AGENTS_MONITOR_PORT:-5173}:5173"
    volumes:
      - ./openspace/config/external_agents.json:/app/openspace/config/external_agents.json:ro
    environment:
      NODE_ENV: production
      PORT: "5173"
      IRONCLAW_INTERNAL_URL: "${IRONCLAW_INTERNAL_URL:-http://host.docker.internal:3231/}"
      IRONCLAW_PUBLIC_URL: "${IRONCLAW_PUBLIC_URL:-http://127.0.0.1:3231/}"
      IRONCLAW_HEALTH_URL: "${IRONCLAW_HEALTH_URL:-http://host.docker.internal:3231/}"
      IRONCLAW_ACTION_URL: "${IRONCLAW_ACTION_URL:-http://host.docker.internal:3231/api/chat/send}"
      IRONCLAW_MCP_URL: "${IRONCLAW_MCP_URL:-}"
      OPENHUMAN_PUBLIC_URL: "${OPENHUMAN_PUBLIC_URL:-http://127.0.0.1:1420/}"
      OPENHUMAN_INTERNAL_URL: "${OPENHUMAN_INTERNAL_URL:-http://openhuman:7788/}"
      OPENHUMAN_HEALTH_URL: "${OPENHUMAN_HEALTH_URL:-http://openhuman:7788/health}"
      OPENHUMAN_ACTION_URL: "${OPENHUMAN_ACTION_URL:-http://openhuman:7788/rpc}"
      HERMES_PUBLIC_URL: "${HERMES_PUBLIC_URL:-http://127.0.0.1:9119/}"
      HERMES_INTERNAL_URL: "${HERMES_INTERNAL_URL:-http://host.docker.internal:8789/}"
      HERMES_HEALTH_URL: "${HERMES_HEALTH_URL:-http://host.docker.internal:8789/health}"
      HERMES_ACTION_URL: "${HERMES_ACTION_URL:-http://host.docker.internal:8789/v1/chat/completions}"
      OPENSPACE_REMOTE_INTERNAL_URL: "http://openspace-remote-agent:8080/mcp"
      OPENSPACE_REMOTE_HEALTH_URL: "http://openspace-remote-agent:8080/mcp"
      OPENSPACE_REMOTE_MCP_URL: "http://openspace-remote-agent:8080/mcp"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5173/healthz').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  cubecloud-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        NODE_BASE_IMAGE: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-base-node:${OPENSPACE_IMAGE_TAG:-main}"
        PYTHON_BASE_IMAGE: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-base-python:${OPENSPACE_IMAGE_TAG:-main}"
    image: "${OPENSPACE_IMAGE_REGISTRY:-ghcr.io/jzkk720}/openspace-cubecloud-dashboard:${OPENSPACE_IMAGE_TAG:-main}"
    depends_on:
      agents-monitor:
        condition: service_healthy
      openspace-remote-agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:${CUBECLOUD_PORT:-7788}:7788"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PYTHONUNBUFFERED: "1"
      MY_DAILY_MONITOR_INTERNAL_URL: "http://agents-monitor:5173/"
      MY_DAILY_MONITOR_PUBLIC_URL: "http://127.0.0.1:${AGENTS_MONITOR_PORT:-5173}/"
      OPEN_DESIGN_PUBLIC_URL: "${OPEN_DESIGN_PUBLIC_URL:-http://127.0.0.1:7831/}"
      OPEN_DESIGN_INTERNAL_URL: "${OPEN_DESIGN_INTERNAL_URL:-http://host.docker.internal:7831/}"
      OPEN_DESIGN_HEALTH_URL: "${OPEN_DESIGN_HEALTH_URL:-http://host.docker.internal:7831/}"
      AIONUI_PUBLIC_URL: "${AIONUI_PUBLIC_URL:-http://127.0.0.1:3308/}"
      AIONUI_INTERNAL_URL: "${AIONUI_INTERNAL_URL:-http://host.docker.internal:3308/}"
      AIONUI_HEALTH_URL: "${AIONUI_HEALTH_URL:-http://host.docker.internal:3308/}"
      OPENSPACE_RUNTIME_MCP_URL: "http://openspace-runtime:8080/mcp"
      OPENSPACE_REMOTE_INTERNAL_URL: "http://openspace-remote-agent:8080/mcp"
      OPENSPACE_REMOTE_HEALTH_URL: "http://openspace-remote-agent:8080/mcp"
      OPENSPACE_REMOTE_MCP_URL: "http://openspace-remote-agent:8080/mcp"
    volumes:
      - openspace_data:/app/.openspace
      - ./logs:/app/logs
      - ./openspace/config/external_agents.json:/app/openspace/config/external_agents.json:ro
      - ./openspace/config/standalone_apps.json:/app/openspace/config/standalone_apps.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7788/api/v1/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  openspace_data:
  openhuman_workspace:
